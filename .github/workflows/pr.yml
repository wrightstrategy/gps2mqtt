name: PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Public fork PRs run outside the private CI pool.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile Python source
        run: python3 -m py_compile gps2mqtt.py
